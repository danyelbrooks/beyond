services:
  # ============================================================
  # Command Center — static site (free, always on)
  # ============================================================
  - type: web
    name: bpm-command-center
    runtime: static
    staticPublishPath: src/command-center
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  # ============================================================
  # API Server — email sending, AI drafts, CFO, insurance
  # ============================================================
  - type: web
    name: bpm-api
    runtime: node
    buildCommand: npm install
    startCommand: node src/api/server.js
    healthCheckPath: /api/health

    envVars:
      # Non-secret
      - key: NODE_ENV
        value: production

      # Secrets — enter these manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LEADSIMPLE_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        sync: false
      - key: APPFOLIO_CLIENT_ID
        sync: false
      - key: APPFOLIO_CLIENT_SECRET
        sync: false

  # ============================================================
  # Onboarding Portal — client-facing intake form
  # ============================================================
  - type: web
    name: bpm-onboarding-portal
    runtime: node
    buildCommand: npm install
    startCommand: node src/onboarding/server.js
    healthCheckPath: /api/health

    # Non-secret values — hardcoded here, no manual entry needed
    envVars:
      - key: ONBOARDING_PORT
        value: "3006"

      - key: PORTAL_BASE_URL
        value: https://portal.beyondpropertymanagement.com

      - key: BPM_MAILING_ADDRESS
        value: "Beyond Property Management, 1220 N Coast Hwy 101 #120, Encinitas CA 92024"

      - key: ONBOARDING_API_KEY
        value: "bpm-staff-2026"

      # Secrets — Render will prompt you to enter these during setup.
      # Never put the actual values in this file.

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY
        sync: false

      - key: GOOGLE_DRIVE_ONBOARDING_FOLDER_ID
        sync: false

      - key: APPFOLIO_STACK_CLIENT_ID
        sync: false

      - key: APPFOLIO_STACK_CLIENT_SECRET
        sync: false

      - key: APPFOLIO_DEVELOPER_ID
        value: "ba023937-8784-11f1-8ce1-0a9c478fe029"

      - key: APPFOLIO_TRUST_ACCOUNT_ID
        value: "e6bec046-8097-11eb-8ad9-06457bb955b6"

  # ============================================================
  # Scorecard Sync — runs every Friday at 6pm Pacific (1am UTC Saturday)
  # ============================================================
  - type: cron
    name: scorecard-sync-friday
    runtime: node
    schedule: "0 1 * * 6"
    buildCommand: npm install
    startCommand: node src/scorecard/sync-scorecard.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: APPFOLIO_DEVELOPER_ID
        value: "ba023937-8784-11f1-8ce1-0a9c478fe029"

      # Secrets — enter these manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LEADSIMPLE_API_KEY
        sync: false
      - key: APPFOLIO_STACK_CLIENT_ID
        sync: false
      - key: APPFOLIO_STACK_CLIENT_SECRET
        sync: false

  # ============================================================
  # Owner Updates Sync — runs every Sunday at 11:59pm Pacific (6:59am UTC Monday)
  # Checks whether each owner with an active-status property (OFFBOARDING, NP,
  # TPO, MO, VACANT, MI, DOWN, PROJECT, INS) received a weekly update email.
  # Writes evidence to the KPI Google Sheet and scorecard.
  # ============================================================
  - type: cron
    name: owner-updates-sync-sunday
    runtime: node
    schedule: "59 6 * * 1"
    buildCommand: npm install
    startCommand: node src/scorecard/sync-owner-updates.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: APPFOLIO_DEVELOPER_ID
        value: "ba023937-8784-11f1-8ce1-0a9c478fe029"

      # Secrets — enter these manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LEADSIMPLE_API_KEY
        sync: false
      - key: APPFOLIO_STACK_CLIENT_ID
        sync: false
      - key: APPFOLIO_STACK_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY
        sync: false
