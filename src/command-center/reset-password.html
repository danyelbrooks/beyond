<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — BPM Command Center</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--color-bg);
    }
    .login-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .login-logo-mark {
      width: 64px; height: 64px;
      background: var(--color-primary);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 800; color: #fff;
      letter-spacing: -0.02em; margin-bottom: 12px;
    }
    .login-logo-name { font-size: 1rem; font-weight: 700; color: var(--color-text); }
    .login-logo-sub  { font-size: 0.8rem; color: var(--color-text-muted); margin-top: 2px; }
    .login-title     { font-size: 1.15rem; font-weight: 700; text-align: center; margin-bottom: 24px; }
    .login-btn {
      width: 100%; padding: 11px;
      background: var(--color-accent); color: #fff;
      border: none; border-radius: 6px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: background .15s; margin-top: 4px;
    }
    .login-btn:hover    { background: var(--color-accent-hover); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg-box {
      border-radius: 6px; padding: 10px 14px;
      font-size: 0.85rem; margin-bottom: 16px; display: none;
    }
    .msg-error   { background:#fff5f5; border:1px solid #fed7d7; color:#9b2c2c; }
    .msg-success { background:#f0fff4; border:1px solid #9ae6b4; color:#22543d; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-mark">BPM</div>
      <div class="login-logo-name">Beyond Property Management</div>
      <div class="login-logo-sub">Command Center</div>
    </div>

    <div class="login-title">Set a new password</div>

    <div class="msg-box" id="msgBox"></div>

    <div id="formWrap">
      <div class="form-group">
        <label class="form-label" for="newPassword">New password</label>
        <input class="form-input" type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm password</label>
        <input class="form-input" type="password" id="confirmPassword" placeholder="Repeat your new password" autocomplete="new-password">
      </div>
      <button class="login-btn" id="saveBtn">Save New Password</button>
    </div>

    <div style="text-align:center;margin-top:16px;">
      <a href="index.html" style="font-size:0.82rem;color:var(--color-text-muted);text-decoration:none;">
        Back to sign in
      </a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './auth.js'

    const msg     = document.getElementById('msgBox')
    const saveBtn = document.getElementById('saveBtn')

    function showMsg(text, type) {
      msg.textContent  = text
      msg.className    = `msg-box msg-${type}`
      msg.style.display = ''
    }

    // Supabase puts the recovery token in the URL hash — exchange it for a session
    const { data: { session }, error: sessionErr } = await supabase.auth.getSession()

    if (!session) {
      showMsg('This reset link has expired or is invalid. Please request a new one.', 'error')
      document.getElementById('formWrap').style.display = 'none'
    }

    saveBtn.addEventListener('click', async () => {
      const pw1 = document.getElementById('newPassword').value
      const pw2 = document.getElementById('confirmPassword').value

      if (!pw1 || pw1.length < 8) {
        showMsg('Password must be at least 8 characters.', 'error')
        return
      }
      if (pw1 !== pw2) {
        showMsg('Passwords do not match.', 'error')
        return
      }

      saveBtn.disabled    = true
      saveBtn.textContent = 'Saving...'

      const { error } = await supabase.auth.updateUser({ password: pw1 })

      if (error) {
        showMsg(error.message || 'Could not update password. Try again.', 'error')
        saveBtn.disabled    = false
        saveBtn.textContent = 'Save New Password'
      } else {
        showMsg('Password updated! Redirecting you to sign in...', 'success')
        document.getElementById('formWrap').style.display = 'none'
        setTimeout(() => { window.location.href = 'index.html' }, 2000)
      }
    })
  </script>

</body>
</html>
