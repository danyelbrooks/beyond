<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Onboarding — BPM Command Center</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    .onb-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
    }

    .filter-tab {
      padding: 6px 14px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--color-surface);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .filter-tab.active {
      background: var(--color-accent);
      color: #fff;
      border-color: var(--color-accent);
    }
    .filter-tab:hover:not(.active) {
      border-color: var(--color-accent);
      color: var(--color-text);
    }

    .onb-table-wrap {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow-x: auto;
      background: var(--color-surface);
    }

    .onb-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
    }

    .onb-table th {
      background: #f8f9fa;
      color: var(--color-text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }

    .onb-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      vertical-align: middle;
      font-size: 0.875rem;
    }

    .onb-table tr:last-child td { border-bottom: none; }
    .onb-table tr:hover td     { background: #f8f9fa; }

    .owner-primary {
      font-weight: 700;
      color: var(--color-text);
    }
    .owner-secondary {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 120px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--color-accent);
      transition: width 0.3s;
    }

    .progress-fill.done { background: #22c55e; }

    .progress-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-pending     { background: #f3f4f6; color: #374151; }
    .status-in_progress { background: #dbeafe; color: #1e40af; }
    .status-complete    { background: #dcfce7; color: #14532d; }
    .status-revoked     { background: #fee2e2; color: #991b1b; }

    .flag-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .stuck-label {
      font-size: 0.78rem;
      color: var(--color-text-muted);
    }

    .action-btn {
      padding: 4px 10px;
      border: 1px solid var(--color-border);
      border-radius: 5px;
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.12s;
      white-space: nowrap;
    }
    .action-btn:hover { background: #f3f4f6; }
    .action-btn.danger { color: #991b1b; border-color: #fca5a5; }
    .action-btn.danger:hover { background: #fee2e2; }

    .actions-cell {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--color-text-muted);
    }
    .empty-state h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }

    .note-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .note-modal-overlay.open { display: flex; }

    .note-modal {
      background: var(--color-surface);
      border-radius: 10px;
      padding: 24px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .note-modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }

    .note-modal textarea {
      width: 100%;
      min-height: 120px;
      padding: 8px 11px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.875rem;
      background: var(--color-bg);
      color: var(--color-text);
      resize: vertical;
      box-sizing: border-box;
    }

    .note-modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .activity-ago {
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
<div id="app-header" class="app-header"></div>
<div class="app-layout">
  <div id="app-sidebar" class="app-sidebar"></div>
  <main class="app-main">

    <div class="page-header">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <h1 class="page-title">Owner Onboarding</h1>
          <p class="page-subtitle">Track every owner through the 7-step onboarding process</p>
        </div>
        <a href="onboarding-new.html" class="btn-primary" style="text-decoration:none">+ New Onboarding</a>
      </div>
    </div>

    <div class="onb-toolbar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="pending">Pending</button>
        <button class="filter-tab" data-filter="in_progress">In Progress</button>
        <button class="filter-tab" data-filter="complete">Complete</button>
        <button class="filter-tab" data-filter="flagged">Flagged</button>
      </div>
      <div id="row-count" style="font-size:0.82rem;color:var(--color-text-muted)"></div>
    </div>

    <div class="onb-table-wrap">
      <table class="onb-table">
        <thead>
          <tr>
            <th>Owner / Property</th>
            <th>Status</th>
            <th>Progress</th>
            <th>Stuck On</th>
            <th>Flags</th>
            <th>Last Activity</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="onb-tbody">
          <tr><td colspan="7"><div class="empty-state"><p>Loading...</p></div></td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Flags modal -->
<div class="note-modal-overlay" id="flags-modal-overlay">
  <div class="note-modal" style="max-width:600px;width:95%">
    <h3 id="flags-modal-title">Flags</h3>
    <div id="flags-modal-body" style="max-height:60vh;overflow-y:auto;margin-bottom:16px"></div>
    <div class="note-modal-actions">
      <button class="btn-secondary" id="flags-close">Close</button>
    </div>
  </div>
</div>

<!-- Note modal -->
<div class="note-modal-overlay" id="note-modal-overlay">
  <div class="note-modal">
    <h3>Staff Notes</h3>
    <textarea id="note-textarea" placeholder="Add notes for this onboarding..."></textarea>
    <div class="note-modal-actions">
      <button class="btn-secondary" id="note-cancel">Cancel</button>
      <button class="btn-primary" id="note-save">Save Note</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth, renderHeader, renderSidebar, supabase } from './auth.js'

  const API = window.location.hostname === 'localhost'
    ? 'http://localhost:3006'
    : 'https://bpm-onboarding-portal.onrender.com'
  let allRows       = []
  let currentFilter = 'all'
  let noteOnboardingId = null
  const API_KEY = 'bpm-staff-2026'

  const STEP_NAMES = {
    1: 'Management Agreement',
    2: 'Property Questionnaire',
    3: 'Tax Forms',
    4: 'Entity Documents',
    5: 'Insurance',
    6: 'Reserve Deposit',
    7: 'Occupied Addendum',
  }

  async function init() {
    const auth = await requireAuth()
    if (!auth) return
    renderHeader(auth.profile)
    renderSidebar('onboarding-dashboard', auth.profile.role, auth.user.email)
    await loadData()
    setupListeners()
  }

  function authHeaders() {
    return { 'Authorization': `Bearer ${API_KEY}` }
  }

  async function loadData() {
    try {
      const res  = await fetch(`${API}/api/onboarding/list`, { headers: authHeaders() })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error)
      allRows = data
      renderTable()
    } catch (err) {
      document.getElementById('onb-tbody').innerHTML =
        `<tr><td colspan="7"><div class="empty-state"><h3>Failed to load</h3><p>${err.message}</p><p style="margin-top:8px;font-size:0.8rem">Is the onboarding server running on port 3006?</p></div></td></tr>`
    }
  }

  function filterRows(rows) {
    if (currentFilter === 'all')         return rows
    if (currentFilter === 'flagged')     return rows.filter(r => r.openFlagCount > 0)
    return rows.filter(r => r.status === currentFilter)
  }

  function timeAgo(isoString) {
    if (!isoString) return 'never'
    const diff = Date.now() - new Date(isoString).getTime()
    const mins  = Math.floor(diff / 60000)
    const hours = Math.floor(diff / 3600000)
    const days  = Math.floor(diff / 86400000)
    if (mins < 2)   return 'just now'
    if (mins < 60)  return `${mins}m ago`
    if (hours < 24) return `${hours}h ago`
    return `${days}d ago`
  }

  function escHtml(s) {
    if (!s) return ''
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  function renderTable() {
    const rows    = filterRows(allRows)
    const tbody   = document.getElementById('onb-tbody')
    const rowCount = document.getElementById('row-count')

    rowCount.textContent = `${rows.length} record${rows.length !== 1 ? 's' : ''}`

    if (rows.length === 0) {
      const labels = { all: 'no onboardings yet', pending: 'no pending', in_progress: 'none in progress', complete: 'none complete', flagged: 'no flagged items' }
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><h3>Nothing here</h3><p>${labels[currentFilter] || ''}</p>${currentFilter === 'all' ? '<p style="margin-top:8px"><a href="onboarding-new.html" class="btn-primary" style="text-decoration:none">+ New Onboarding</a></p>' : ''}</div></td></tr>`
      return
    }

    tbody.innerHTML = rows.map(r => {
      const pct     = r.stepsTotal > 0 ? Math.round((r.stepsCompleted / r.stepsTotal) * 100) : 0
      const isDone  = r.status === 'complete'
      const stuckOn = r.currentStepNumber ? STEP_NAMES[r.currentStepNumber] || `Step ${r.currentStepNumber}` : (isDone ? 'Done' : '—')

      return `
        <tr>
          <td>
            <div class="owner-primary">${escHtml(r.ownerName)}</div>
            <div class="owner-secondary">${escHtml(r.propertyAddress)}</div>
          </td>
          <td>
            <span class="status-badge status-${r.status}">${r.status.replace('_', ' ')}</span>
          </td>
          <td>
            <div class="progress-wrap">
              <div class="progress-bar">
                <div class="progress-fill ${isDone ? 'done' : ''}" style="width:${pct}%"></div>
              </div>
              <span class="progress-label">${r.stepsCompleted}/${r.stepsTotal}</span>
            </div>
          </td>
          <td><span class="stuck-label">${escHtml(stuckOn)}</span></td>
          <td>
            ${r.openFlagCount > 0
              ? `<button class="flag-badge" style="cursor:pointer;border:none;background:none;padding:0" onclick="openFlags('${escHtml(r.id)}','${escHtml(r.ownerName)}')">&#9873; ${r.openFlagCount}</button>`
              : '<span style="color:var(--color-text-muted);font-size:0.78rem">—</span>'}
          </td>
          <td><span class="activity-ago">${timeAgo(r.lastActivityAt)}</span></td>
          <td>
            <div class="actions-cell">
              <button class="action-btn" onclick="copyLink('${escHtml(r.portalLink)}')">Copy Link</button>
              <button class="action-btn" onclick="openNote('${escHtml(r.id)}')">Note</button>
              <button class="action-btn" onclick="downloadIntakePDF('${escHtml(r.id)}', '${escHtml(r.shortAddress)}')">Intake PDF</button>
              ${r.status !== 'revoked' && r.status !== 'complete'
                ? `<button class="action-btn" onclick="markComplete('${escHtml(r.id)}', '${escHtml(r.ownerName)}')">Mark Complete</button>
                   <button class="action-btn danger" onclick="revokeOnboarding('${escHtml(r.id)}', '${escHtml(r.ownerName)}')">Revoke</button>`
                : ''}
              <button class="action-btn danger" onclick="deleteOnboarding('${escHtml(r.id)}', '${escHtml(r.ownerName)}')">Delete</button>
            </div>
          </td>
        </tr>
      `
    }).join('')
  }

  function setupListeners() {
    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'))
        btn.classList.add('active')
        currentFilter = btn.dataset.filter
        renderTable()
      })
    })

    document.getElementById('flags-close').addEventListener('click', closeFlagsModal)
    document.getElementById('flags-modal-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeFlagsModal()
    })
    document.getElementById('note-cancel').addEventListener('click', closeNoteModal)
    document.getElementById('note-save').addEventListener('click', saveNote)
    document.getElementById('note-modal-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeNoteModal()
    })
  }

  // Exposed to inline onclick handlers
  window.copyLink = function(link) {
    navigator.clipboard.writeText(link).then(() => alert('Portal link copied to clipboard!'))
  }

  window.downloadIntakePDF = async function(id, shortAddress) {
    try {
      const res = await fetch(`${API}/api/onboarding/${id}/intake-pdf`, {
        headers: authHeaders()
      })
      if (!res.ok) { alert('Could not generate PDF. Try again.'); return }
      const blob = await res.blob()
      const url  = URL.createObjectURL(blob)
      const a    = document.createElement('a')
      a.href     = url
      a.download = `${shortAddress} Intake Summary.pdf`
      a.click()
      URL.revokeObjectURL(url)
    } catch (err) {
      alert('Download failed. Make sure the onboarding server is running.')
    }
  }

  const FLAG_LABELS = {
    appfolio_sync_error:     '🔴 AppFolio Sync Error',
    appfolio_property_entry: '📋 AppFolio Setup — Action Required',
    insurance_scan_complete: '🛡️ Insurance Scan',
    todo_insurance_followup: '📅 Insurance Follow-up',
    verify_deposit:          '💰 Verify Deposit',
    onboarding_complete:     '✅ Onboarding Complete',
    ca_588_pending_ftb:      '📄 FTB Form 588 Pending',
    tin_type_mismatch:       '⚠️ TIN Type Mismatch',
  }

  window.openFlags = async function(id, ownerName) {
    document.getElementById('flags-modal-title').textContent = `Flags — ${ownerName}`
    document.getElementById('flags-modal-body').innerHTML = '<p style="color:var(--color-text-muted)">Loading…</p>'
    document.getElementById('flags-modal-overlay').classList.add('open')

    try {
      const res   = await fetch(`${API}/api/onboarding/${id}/flags`, { headers: authHeaders() })
      const flags = await res.json()

      if (!flags.length) {
        document.getElementById('flags-modal-body').innerHTML = '<p style="color:var(--color-text-muted)">No flags.</p>'
        return
      }

      document.getElementById('flags-modal-body').innerHTML = flags.map(f => `
        <div style="border:1px solid var(--color-border);border-radius:8px;padding:12px 14px;margin-bottom:10px;${f.resolved_at ? 'opacity:0.5' : ''}">
          <div style="font-weight:600;font-size:0.85rem;margin-bottom:6px">${escHtml(FLAG_LABELS[f.flag_type] || f.flag_type)}${f.resolved_at ? ' <span style="font-weight:400;font-size:0.75rem">(resolved)</span>' : ''}</div>
          <pre style="white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:0.82rem;margin:0;color:var(--color-text)">${escHtml(f.message)}</pre>
          <div style="font-size:0.72rem;color:var(--color-text-muted);margin-top:6px">${new Date(f.created_at).toLocaleString()}</div>
        </div>
      `).join('')
    } catch (err) {
      document.getElementById('flags-modal-body').innerHTML = `<p style="color:red">Failed to load flags: ${escHtml(err.message)}</p>`
    }
  }

  function closeFlagsModal() {
    document.getElementById('flags-modal-overlay').classList.remove('open')
  }

  window.openNote = function(id) {
    noteOnboardingId = id
    const row = allRows.find(r => r.id === id)
    document.getElementById('note-textarea').value = row?.staffNotes || ''
    document.getElementById('note-modal-overlay').classList.add('open')
  }

  window.markComplete = async function(id, name) {
    if (!confirm(`Mark onboarding for ${name} as complete? This will generate the Entry Sheet PDF, sync to AppFolio, and send a completion notification.`)) return
    try {
      const res = await fetch(`${API}/api/onboarding/${id}/complete`, {
        method: 'POST',
        headers: authHeaders(),
      })
      if (!res.ok) throw new Error('Failed')
      await loadData()
    } catch { alert('Failed to mark complete — try again.') }
  }

  window.revokeOnboarding = async function(id, name) {
    if (!confirm(`Revoke onboarding for ${name}? The portal link will stop working.`)) return
    try {
      const res = await fetch(`${API}/api/onboarding/${id}/revoke`, {
        method: 'DELETE',
        headers: authHeaders(),
      })
      if (!res.ok) throw new Error('Failed')
      await loadData()
    } catch { alert('Failed to revoke — try again.') }
  }

  window.deleteOnboarding = async function(id, name) {
    if (!confirm(`Permanently delete onboarding for ${name}?\n\nThis removes ALL data including steps, documents, and flags. This cannot be undone.`)) return
    try {
      const res = await fetch(`${API}/api/onboarding/${id}`, {
        method: 'DELETE',
        headers: authHeaders(),
      })
      if (!res.ok) throw new Error('Failed')
      await loadData()
    } catch { alert('Failed to delete — try again.') }
  }

  function closeNoteModal() {
    document.getElementById('note-modal-overlay').classList.remove('open')
    noteOnboardingId = null
  }

  async function saveNote() {
    if (!noteOnboardingId) return
    const notes = document.getElementById('note-textarea').value
    try {
      const res = await fetch(`${API}/api/onboarding/${noteOnboardingId}/notes`, {
        method:  'PATCH',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body:    JSON.stringify({ notes }),
      })
      if (!res.ok) throw new Error('Failed')
      closeNoteModal()
      await loadData()
    } catch { alert('Failed to save note.') }
  }

  init()
</script>
</body>
</html>
