<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Health — BPM Command Center</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>

    /* ── Tier tokens ───────────────────────────────────────── */
    :root {
      --tier-at-risk:  #E04444;
      --tier-watch:    #E87A30;
      --tier-stable:   #3B82F6;
      --tier-advocate: #22C55E;
    }

    /* ── Tier pills ────────────────────────────────────────── */
    .tier-pill-bar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
    .tier-pill {
      display:flex; align-items:center; gap:10px;
      padding:10px 18px; border-radius:8px; border:2px solid transparent;
      cursor:pointer; font-size:0.85rem; font-weight:600;
      transition:border-color .15s, opacity .15s; user-select:none;
    }
    .tier-pill:hover { opacity:.85; }
    .tier-pill[data-tier="at_risk"]  { background:#fff1f1; border-color:#fca5a5; color:var(--tier-at-risk); }
    .tier-pill[data-tier="watch"]    { background:#fff7ed; border-color:#fdba74; color:var(--tier-watch); }
    .tier-pill[data-tier="stable"]   { background:#eff6ff; border-color:#93c5fd; color:var(--tier-stable); }
    .tier-pill[data-tier="advocate"] { background:#f0fdf4; border-color:#86efac; color:var(--tier-advocate); }
    .tier-pill.active[data-tier="at_risk"]  { border-color:var(--tier-at-risk); }
    .tier-pill.active[data-tier="watch"]    { border-color:var(--tier-watch); }
    .tier-pill.active[data-tier="stable"]   { border-color:var(--tier-stable); }
    .tier-pill.active[data-tier="advocate"] { border-color:var(--tier-advocate); }
    .tier-pill-count { font-size:1.5rem; font-weight:800; line-height:1; }
    .tier-pill-label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }

    /* ── Filter row ────────────────────────────────────────── */
    .filter-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .rh-search {
      flex:1; min-width:180px; max-width:300px;
      padding:7px 12px; border:1px solid var(--color-border);
      border-radius:6px; font-size:.875rem;
      background:var(--color-surface); color:var(--color-text); outline:none;
    }
    .rh-search:focus { border-color:var(--color-accent); box-shadow:0 0 0 2px rgba(52,152,219,.15); }
    .period-btn {
      padding:6px 14px; border-radius:6px; font-size:.8rem; font-weight:600;
      border:1px solid var(--color-border); background:var(--color-surface);
      color:var(--color-text-muted); cursor:pointer;
    }
    .period-btn.active { background:var(--color-accent); color:#fff; border-color:var(--color-accent); }

    /* ── Score bar ─────────────────────────────────────────── */
    .score-bar-wrap { display:flex; align-items:center; gap:8px; }
    .score-bar {
      flex:1; height:6px; border-radius:3px;
      background:var(--color-border); overflow:hidden; min-width:60px;
    }
    .score-bar-fill { height:100%; border-radius:3px; transition:width .3s; }
    .score-num { font-weight:700; font-size:.875rem; min-width:28px; text-align:right; }

    /* ── Table ─────────────────────────────────────────────── */
    .rh-table { width:100%; border-collapse:collapse; font-size:.875rem; }
    .rh-table th {
      text-align:left; padding:8px 12px; font-size:.72rem;
      font-weight:700; text-transform:uppercase; letter-spacing:.05em;
      color:var(--color-text-muted); border-bottom:2px solid var(--color-border);
    }
    .rh-table td { padding:10px 12px; border-bottom:1px solid var(--color-border); vertical-align:middle; }
    .rh-table tbody tr { cursor:pointer; transition:background .1s; }
    .rh-table tbody tr:hover { background:var(--color-bg); }

    .tier-badge {
      display:inline-block; padding:3px 8px; border-radius:4px;
      font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    }
    .tier-badge.at_risk  { background:#fee2e2; color:var(--tier-at-risk); }
    .tier-badge.watch    { background:#ffedd5; color:var(--tier-watch); }
    .tier-badge.stable   { background:#dbeafe; color:var(--tier-stable); }
    .tier-badge.advocate { background:#dcfce7; color:var(--tier-advocate); }

    .flag-911-btn {
      background:transparent; color:#dc2626;
      border:1px solid #fca5a5; border-radius:5px;
      padding:4px 10px; font-size:.72rem; font-weight:700;
      cursor:pointer; white-space:nowrap;
    }
    .flag-911-btn:hover { background:#fee2e2; }
    .on-911-badge {
      display:inline-flex; align-items:center; gap:4px;
      font-size:.72rem; font-weight:700; color:#dc2626;
    }
    .pulse-dot {
      width:7px; height:7px; border-radius:50%; background:#dc2626;
      animation:pulse911 1.5s ease-in-out infinite;
    }
    @keyframes pulse911 {
      0%,100% { box-shadow:0 0 0 0 rgba(220,38,38,.5); }
      50%      { box-shadow:0 0 0 5px rgba(220,38,38,0); }
    }

    .renewal-flag {
      display:inline-block; padding:2px 6px; border-radius:4px;
      font-size:.65rem; font-weight:700; text-transform:uppercase;
      background:#fef3c7; color:#b45309; margin-left:4px;
    }

    /* ── Loading / empty ───────────────────────────────────── */
    .loading-state {
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:12px; padding:60px 20px;
      color:var(--color-text-muted); font-size:.875rem;
    }
    .spinner {
      width:32px; height:32px; border:3px solid var(--color-border);
      border-top-color:var(--color-accent); border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Drawer ────────────────────────────────────────────── */
    .drawer-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.35); z-index:50;
    }
    .drawer-overlay.open { display:block; }
    .drawer {
      position:fixed; top:0; right:0; bottom:0; width:420px; max-width:95vw;
      background:var(--color-surface); box-shadow:-4px 0 24px rgba(0,0,0,.15);
      z-index:51; overflow-y:auto; padding:28px;
      transform:translateX(100%); transition:transform .25s ease;
    }
    .drawer.open { transform:translateX(0); }
    .drawer-close {
      position:absolute; top:16px; right:16px;
      background:none; border:none; font-size:1.2rem;
      cursor:pointer; color:var(--color-text-muted);
    }
    .drawer-close:hover { color:var(--color-text); }
    .drawer-name { font-size:1.1rem; font-weight:800; margin-bottom:4px; }
    .drawer-sub  { font-size:.8rem; color:var(--color-text-muted); margin-bottom:18px; }
    .drawer-score-big {
      font-size:3rem; font-weight:900; line-height:1; margin-bottom:4px;
    }
    .drawer-section { margin-top:20px; }
    .drawer-label {
      font-size:.72rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.06em; color:var(--color-text-muted); margin-bottom:8px;
    }
    .component-row {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:8px; font-size:.875rem;
    }
    .component-bar-wrap { display:flex; align-items:center; gap:8px; flex:1; margin:0 12px; }
    .component-bar { flex:1; height:5px; border-radius:3px; background:var(--color-border); }
    .component-bar-fill { height:100%; border-radius:3px; }
    .component-pts { font-size:.8rem; font-weight:700; min-width:40px; text-align:right; }

    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .detail-cell { background:var(--color-bg); border-radius:6px; padding:10px 12px; }
    .detail-cell-label { font-size:.7rem; color:var(--color-text-muted); font-weight:600; text-transform:uppercase; margin-bottom:3px; }
    .detail-cell-value { font-size:.9rem; font-weight:700; }

    .comm-pref-btn {
      padding:6px 12px; border-radius:6px; font-size:.78rem; font-weight:600;
      border:1px solid var(--color-border); background:var(--color-surface);
      color:var(--color-text-muted); cursor:pointer; margin-right:6px; margin-bottom:6px;
    }
    .comm-pref-btn.active { background:var(--color-accent); color:#fff; border-color:var(--color-accent); }

    .notes-textarea {
      width:100%; padding:8px 10px; border:1px solid var(--color-border);
      border-radius:6px; font-size:.875rem; background:var(--color-bg);
      color:var(--color-text); font-family:inherit; resize:vertical;
      min-height:80px; box-sizing:border-box; outline:none;
    }
    .notes-textarea:focus { border-color:var(--color-accent); }
    .save-status { font-size:.75rem; color:var(--color-text-muted); margin-top:4px; }

    .btn-911-drawer {
      width:100%; padding:10px; background:#dc2626; color:#fff;
      border:none; border-radius:8px; font-size:.875rem; font-weight:700;
      cursor:pointer; margin-top:14px; letter-spacing:.02em;
    }
    .btn-911-drawer:hover { background:#b91c1c; }

    /* ── 911 modal ─────────────────────────────────────────── */
    .modal-backdrop {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.45); z-index:100;
      align-items:center; justify-content:center;
    }
    .modal-backdrop.open { display:flex; }
    .modal-box {
      background:var(--color-surface); border-radius:12px;
      padding:28px; width:100%; max-width:460px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }
    .modal-title { font-size:1.05rem; font-weight:700; margin-bottom:18px; }
    .modal-label { font-size:.8rem; font-weight:600; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
    .modal-textarea {
      width:100%; padding:9px 12px; border:1px solid var(--color-border);
      border-radius:6px; font-size:.875rem; background:var(--color-bg);
      color:var(--color-text); box-sizing:border-box; margin-bottom:14px;
      outline:none; font-family:inherit; min-height:100px; resize:vertical;
    }
    .modal-textarea:focus { border-color:var(--color-accent); }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; }
    .btn-primary { background:var(--color-accent); color:#fff; border:none; border-radius:6px; padding:9px 20px; font-size:.875rem; font-weight:600; cursor:pointer; }
    .btn-primary:hover { opacity:.88; }
    .btn-ghost { background:transparent; color:var(--color-text-muted); border:1px solid var(--color-border); border-radius:6px; padding:9px 16px; font-size:.875rem; cursor:pointer; }

    /* ── Toast ─────────────────────────────────────────────── */
    #toast {
      position:fixed; bottom:24px; right:24px;
      background:#1e293b; color:#fff; padding:10px 18px;
      border-radius:8px; font-size:.85rem; font-weight:500;
      opacity:0; transition:opacity .25s; z-index:200; pointer-events:none;
    }
    #toast.show { opacity:1; }

    /* ── Phase 2 notice ────────────────────────────────────── */
    .phase2-notice {
      background:#f8fafc; border:1px solid var(--color-border);
      border-radius:8px; padding:12px 16px; margin-bottom:20px;
      font-size:.8rem; color:var(--color-text-muted); line-height:1.5;
    }
    .phase2-notice strong { color:var(--color-text); }

  </style>
</head>
<body>
  <div id="app-header" class="app-header"></div>
  <div class="app-shell">
    <nav id="app-sidebar" class="app-sidebar"></nav>
    <main class="app-main">

      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap;">
        <div>
          <div style="font-size:1.4rem;font-weight:800;">Resident Health</div>
          <div style="font-size:.85rem;color:var(--color-text-muted);margin-top:2px;">
            Relationship scores — <span id="lastRefreshed">loading…</span>
          </div>
        </div>
        <button class="btn btn-secondary" id="btnRefresh" style="font-size:.8rem;">Refresh Scores</button>
      </div>

      <div class="phase2-notice" id="loadingState">
        <div class="loading-state">
          <div class="spinner"></div>
          <span id="loadingMsg">Checking login…</span>
        </div>
      </div>

      <div id="rhContent" style="display:none;">

        <!-- Tier pills -->
        <div class="tier-pill-bar" id="tierPillBar">
          <div class="tier-pill active" data-tier="at_risk">
            <div><div class="tier-pill-count" id="count-at_risk">0</div><div class="tier-pill-label">At Risk</div></div>
          </div>
          <div class="tier-pill active" data-tier="watch">
            <div><div class="tier-pill-count" id="count-watch">0</div><div class="tier-pill-label">Watch</div></div>
          </div>
          <div class="tier-pill active" data-tier="stable">
            <div><div class="tier-pill-count" id="count-stable">0</div><div class="tier-pill-label">Stable</div></div>
          </div>
          <div class="tier-pill active" data-tier="advocate">
            <div><div class="tier-pill-count" id="count-advocate">0</div><div class="tier-pill-label">Advocate</div></div>
          </div>
        </div>

        <!-- Filters -->
        <div class="filter-row">
          <input class="rh-search" id="residentSearch" type="text" placeholder="Search name or property…">
          <div id="tierFilter" style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="period-btn active" data-tier="all">All</button>
            <button class="period-btn" data-tier="at_risk">At Risk</button>
            <button class="period-btn" data-tier="watch">Watch</button>
            <button class="period-btn" data-tier="stable">Stable</button>
            <button class="period-btn" data-tier="advocate">Advocate</button>
          </div>
        </div>

        <!-- Table -->
        <div style="overflow-x:auto;">
          <table class="rh-table">
            <thead>
              <tr>
                <th>Resident</th>
                <th>Address / Unit</th>
                <th>Tier</th>
                <th>Why</th>
                <th>PM</th>
                <th>Notes</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="residentTableBody">
              <tr><td colspan="7"><div class="loading-state"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>

      </div>

    </main>
  </div>

  <!-- Drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <button class="drawer-close" id="drawerClose">&#10005;</button>
    <div id="drawerInner"></div>
  </div>

  <!-- 911 modal -->
  <div class="modal-backdrop" id="modal911">
    <div class="modal-box">
      <div class="modal-title">Flag for Resident 911</div>
      <div style="font-size:.875rem;color:var(--color-text-muted);margin-bottom:16px;" id="modal911Resident"></div>
      <div class="modal-label">What is the concern?</div>
      <textarea class="modal-textarea" id="modal911Concern" placeholder="Describe the resident's issue or request that needs to be resolved to 100%…"></textarea>
      <div class="modal-actions">
        <button class="btn-ghost" id="modal911Cancel">Cancel</button>
        <button class="btn-primary" id="modal911Save">Add to 911 List</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { supabase, requireAuth, renderHeader, renderSidebar } from './auth.js'

    let allResidents = []
    let activeTier   = 'all'
    let searchQuery  = ''
    let currentUser  = null
    let drawerResident = null

    const setMsg = m => { const el = document.getElementById('loadingMsg'); if (el) el.textContent = m }

    // ── Boot ──────────────────────────────────────────────────────────────────
    setMsg('Checking login…')
    const auth = await requireAuth()
    if (!auth) throw new Error('Not authenticated')
    setMsg('Loading residents…')

    currentUser = auth
    renderHeader(auth.profile)
    renderSidebar('resident-health', auth.profile.role, auth.user.email)

    document.getElementById('btnRefresh').addEventListener('click', loadResidents)
    document.getElementById('drawerOverlay').addEventListener('click', closeDrawer)
    document.getElementById('drawerClose').addEventListener('click', closeDrawer)

    // Tier pill filter
    document.getElementById('tierPillBar').addEventListener('click', e => {
      const pill = e.target.closest('.tier-pill')
      if (!pill) return
      const tier = pill.dataset.tier
      activeTier = activeTier === tier ? 'all' : tier
      syncFilterTabs()
      renderTable()
    })

    // Tier tab filter
    document.getElementById('tierFilter').addEventListener('click', e => {
      const btn = e.target.closest('.period-btn')
      if (!btn) return
      document.querySelectorAll('#tierFilter .period-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      activeTier = btn.dataset.tier
      renderTable()
    })

    // Search
    let searchTimer = null
    document.getElementById('residentSearch').addEventListener('input', e => {
      clearTimeout(searchTimer)
      searchTimer = setTimeout(() => { searchQuery = e.target.value.trim(); renderTable() }, 250)
    })

    await loadResidents()

    // ── Load ──────────────────────────────────────────────────────────────────
    async function loadResidents() {
      document.getElementById('loadingState').style.display = 'flex'
      document.getElementById('loadingState').innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Loading resident scores…</span></div>'
      document.getElementById('rhContent').style.display = 'none'

      try {
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Request timed out. Try refreshing.')), 20000)
        )
        const query = supabase
          .from('v_resident_health')
          .select('*')
          .order('score', { ascending: true })

        const { data, error } = await Promise.race([query, timeout])
        if (error) throw error
        allResidents = data || []
        render()
      } catch (err) {
        document.getElementById('loadingState').innerHTML = `
          <div class="alert alert-danger" style="max-width:520px;">
            <div style="margin-bottom:12px;">Could not load resident data: ${esc(err.message)}</div>
            <button onclick="location.reload()" style="padding:8px 16px;background:var(--color-accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Try Again</button>
          </div>
        `
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function render() {
      // Tier counts
      const counts = { advocate:0, stable:0, watch:0, at_risk:0 }
      for (const r of allResidents) counts[r.tier || 'watch']++
      for (const [t, n] of Object.entries(counts)) {
        const el = document.getElementById(`count-${t}`)
        if (el) el.textContent = n
      }
      document.getElementById('lastRefreshed').textContent = 'Updated just now'
      document.getElementById('loadingState').style.display = 'none'
      document.getElementById('rhContent').style.display = ''
      renderTable()
    }

    function renderTable() {
      const q = searchQuery.toLowerCase()
      let list = allResidents

      if (activeTier !== 'all') list = list.filter(r => r.tier === activeTier)
      if (q) list = list.filter(r =>
        r.resident_name?.toLowerCase().includes(q) ||
        r.property_name?.toLowerCase().includes(q) ||
        r.unit_number?.toLowerCase().includes(q)
      )

      const tbody = document.getElementById('residentTableBody')
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--color-text-muted);">No residents match this filter.</td></tr>`
        return
      }

      tbody.innerHTML = list.map(r => {
        const tier  = r.tier ?? 'watch'
        const why   = whyText(r)
        const notes = r.notes ? esc(r.notes).slice(0, 60) + (r.notes.length > 60 ? '…' : '') : ''

        const on911 = r.on_911_list
        const statusCell = on911
          ? `<span class="on-911-badge"><span class="pulse-dot"></span>911</span>`
          : `<button class="flag-911-btn" onclick="open911Modal(event, '${r.resident_id}', ${JSON.stringify(esc(r.resident_name ?? ''))})">911</button>`

        return `
          <tr onclick="openDrawer('${r.resident_id}')">
            <td><strong>${esc(r.resident_name ?? '—')}</strong></td>
            <td style="font-size:.8rem;color:var(--color-text-muted);">
              ${esc(r.property_address || r.property_name || '—')}<br><span style="font-size:.75rem;">Unit ${esc(r.unit_number ?? '—')}</span>
            </td>
            <td><span class="tier-badge ${tier}">${tierLabel(tier)}</span></td>
            <td style="font-size:.78rem;color:var(--color-text-muted);max-width:180px;">${why}</td>
            <td style="font-size:.78rem;color:var(--color-text-muted);">${esc(r.property_manager ?? '—')}</td>
            <td style="font-size:.75rem;color:var(--color-text-muted);max-width:160px;font-style:${notes ? 'normal' : 'italic'};">${notes || 'No notes'}</td>
            <td onclick="event.stopPropagation();">${statusCell}</td>
          </tr>
        `
      }).join('')
    }

    // ── Drawer ────────────────────────────────────────────────────────────────
    window.openDrawer = async function(id) {
      const r = allResidents.find(x => x.resident_id === id)
      if (!r) return
      drawerResident = r
      const color = tierColor(r.tier)

      document.getElementById('drawerInner').innerHTML = `
        <div class="drawer-name">${esc(r.resident_name ?? '—')}</div>
        <div class="drawer-sub">
          ${r.property_address
            ? `${esc(r.property_address)} · Unit ${esc(r.unit_number ?? '—')}`
            : `${esc(r.property_name ?? '—')} · Unit ${esc(r.unit_number ?? '—')}`}
          · ${esc(r.property_manager ?? '')}
        </div>

        <span class="tier-badge ${r.tier ?? 'watch'}" style="margin-bottom:16px;display:inline-block;font-size:.8rem;">${tierLabel(r.tier)}</span>
        ${r.on_911_list ? '<div style="display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:.8rem;font-weight:700;color:#dc2626;"><span class="pulse-dot"></span>On 911 List</div>' : ''}

        <div class="drawer-section">
          <div class="drawer-label">Score Breakdown — Service Quality</div>
          ${componentRow('Email Response', r.score_email_response, 40, color)}
          ${componentRow('Open Threads',   r.score_open_threads,   30, color)}
          ${componentRow('Base',           30,                     30, color)}
          <div style="font-size:.72rem;color:var(--color-text-muted);margin-top:8px;line-height:1.5;">
            ${whyDetailText(r)}
          </div>
        </div>

        <div class="drawer-section">
          <div class="drawer-label">Last Contact</div>
          <div id="lastContactArea" style="font-size:.82rem;color:var(--color-text-muted);">Loading…</div>
        </div>

        <div class="drawer-section">
          <div class="drawer-label">Communication</div>
          ${r.resident_email ? `
            <div style="display:flex;flex-direction:column;gap:8px;">
              <a href="resident-emails.html?email=${encodeURIComponent(r.resident_email)}&name=${encodeURIComponent(r.resident_name ?? '')}"
                 target="_blank"
                 style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:6px;
                        border:1px solid var(--color-border);background:var(--color-bg);
                        font-size:.82rem;font-weight:600;color:var(--color-accent);text-decoration:none;">
                ✉ Email Thread
              </a>
              <a href="${r.leadsimple_contact_id
                  ? `https://app.leadsimple.com/v2/contacts/${r.leadsimple_contact_id}`
                  : `https://app.leadsimple.com/v2/contacts`}"
                 target="_blank"
                 style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:6px;
                        border:1px solid var(--color-border);background:var(--color-bg);
                        font-size:.82rem;font-weight:600;color:var(--color-text);text-decoration:none;">
                ↗ ${r.leadsimple_contact_id ? 'Open Contact in LeadSimple' : 'Open LeadSimple (search manually)'}
              </a>
              <div style="font-size:.72rem;color:var(--color-text-muted);">${esc(r.resident_email)}</div>
            </div>
          ` : `<div style="font-size:.8rem;color:var(--color-text-muted);">No email on file — communication log not available.</div>`}
        </div>

        <div class="drawer-section">
          <div class="drawer-label">Notes</div>
          <textarea class="notes-textarea" id="drawerNotes" placeholder="Staff notes about this resident…">${esc(r.notes ?? '')}</textarea>
          <div class="save-status" id="notesSaveStatus"></div>
          <button class="btn btn-secondary" style="margin-top:6px;font-size:.78rem;" onclick="saveNotes('${r.resident_id}')">Save Notes</button>
        </div>

        ${!r.on_911_list ? `
          <button class="btn-911-drawer" onclick="open911Modal(null, '${r.resident_id}', ${JSON.stringify(esc(r.resident_name ?? ''))})">
            Flag for Resident 911
          </button>
        ` : ''}
      `

      // Auto-save notes on blur
      document.getElementById('drawerNotes')?.addEventListener('blur', () => saveNotes(r.resident_id))

      document.getElementById('drawer').classList.add('open')
      document.getElementById('drawerOverlay').classList.add('open')

      // Fetch last contact (most recent email to or from this resident)
      if (r.resident_email) {
        const email = r.resident_email.toLowerCase()
        const { data: lastEmails } = await supabase
          .from('email_cache')
          .select('received_at, subject, from_address, from_name')
          .or(`from_address.ilike.%${email}%,to_address.ilike.%${email}%`)
          .order('received_at', { ascending: false })
          .limit(1)

        const el = document.getElementById('lastContactArea')
        if (el) {
          if (lastEmails && lastEmails.length > 0) {
            const e = lastEmails[0]
            const isInbound = e.from_address?.toLowerCase().includes(email)
            const direction = isInbound ? 'Inbound from resident' : 'Outbound to resident'
            const date = new Date(e.received_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
            el.innerHTML = `
              <div style="font-weight:600;color:var(--color-text);">${date}</div>
              <div style="margin-top:2px;">${direction} — ${esc(e.subject || '(no subject)')}</div>
              <div style="font-size:.72rem;margin-top:4px;color:var(--color-text-muted);">Email only · Phone &amp; text history: see LeadSimple</div>
            `
          } else {
            el.textContent = 'No emails on file. Check LeadSimple for phone and text history.'
          }
        }
      } else {
        const el = document.getElementById('lastContactArea')
        if (el) el.textContent = 'No email on file. Check LeadSimple for contact history.'
      }
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open')
      document.getElementById('drawerOverlay').classList.remove('open')
      drawerResident = null
    }

    window.saveCommPref = async function(residentId, pref, btn) {
      document.querySelectorAll('.comm-pref-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      const { error } = await supabase
        .from('resident_profiles')
        .upsert({ resident_id: residentId, communication_pref: pref }, { onConflict: 'resident_id' })
      if (error) showToast('Could not save preference')
      else {
        const r = allResidents.find(x => x.resident_id === residentId)
        if (r) r.communication_pref = pref
        showToast(`Preference saved: ${cap(pref)}`)
      }
    }

    window.saveNotes = async function(residentId) {
      const notes  = document.getElementById('drawerNotes')?.value ?? ''
      const status = document.getElementById('notesSaveStatus')
      const { error } = await supabase
        .from('resident_profiles')
        .upsert({ resident_id: residentId, notes }, { onConflict: 'resident_id' })
      if (error) { if (status) status.textContent = 'Save failed'; return }
      if (status) { status.textContent = 'Saved ✓'; setTimeout(() => { if (status) status.textContent = '' }, 2000) }
      const r = allResidents.find(x => x.resident_id === residentId)
      if (r) r.notes = notes
    }

    // ── Resident 911 modal ────────────────────────────────────────────────────
    let modal911Target = null

    window.open911Modal = function(e, residentId, name) {
      if (e) e.stopPropagation()
      modal911Target = residentId
      document.getElementById('modal911Resident').textContent = name
      document.getElementById('modal911Concern').value = ''
      document.getElementById('modal911').classList.add('open')
    }

    document.getElementById('modal911Cancel').addEventListener('click', () => {
      document.getElementById('modal911').classList.remove('open')
    })

    document.getElementById('modal911Save').addEventListener('click', async () => {
      const concern = document.getElementById('modal911Concern').value.trim()
      if (!concern) { showToast('Please describe the concern'); return }

      const { error } = await supabase.from('resident_911').insert({
        resident_id: modal911Target,
        concern,
        flagged_by:  currentUser.user.id,
        status:      'active',
      })

      if (error) { showToast('Could not add to 911 list'); return }
      document.getElementById('modal911').classList.remove('open')
      showToast('Added to Resident 911 list')
      modal911Target = null
      closeDrawer()
      await loadResidents()
    })

    document.getElementById('modal911').addEventListener('click', e => {
      if (e.target === document.getElementById('modal911')) document.getElementById('modal911').classList.remove('open')
    })

    // ── Helpers ───────────────────────────────────────────────────────────────
    function tierColor(tier) {
      return { advocate:'#22c55e', stable:'#3b82f6', watch:'#e87a30', at_risk:'#e04444' }[tier] || '#94a3b8'
    }
    function tierLabel(tier) {
      return { advocate:'Advocate', stable:'Stable', watch:'Watch', at_risk:'At Risk' }[tier] || tier
    }
    function syncFilterTabs() {
      document.querySelectorAll('#tierFilter .period-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tier === activeTier)
      })
    }
    function leaseLabel(leaseEnd, daysLeft) {
      if (!leaseEnd) return '—'
      if (daysLeft === null) return fmtDate(leaseEnd)
      if (daysLeft < 0) return `<span style="color:#dc2626;">Expired</span>`
      return fmtDate(leaseEnd)
    }
    function fmtDate(str) {
      if (!str) return '—'
      return new Date(str).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
    }
    function fmtDollars(cents) {
      if (cents === null || cents === undefined) return '—'
      const abs = Math.abs(cents / 100).toFixed(2)
      return cents < 0 ? `+$${abs}` : cents === 0 ? '$0' : `$${abs}`
    }
    function componentRow(label, pts, maxPts, color) {
      const pct = maxPts > 0 ? Math.round(((pts ?? 0) / maxPts) * 100) : 0
      return `
        <div class="component-row">
          <span style="min-width:130px;font-size:.82rem;">${label}</span>
          <div class="component-bar-wrap">
            <div class="component-bar">
              <div class="component-bar-fill" style="width:${pct}%;background:${color};"></div>
            </div>
          </div>
          <span class="component-pts" style="color:${color};">${pts ?? 0}/${maxPts}</span>
        </div>
      `
    }
    function whyText(r) {
      if (r.on_911_list) return '911 list — capped At Risk'
      const avg   = r.avg_response_hours
      const open  = r.open_thread_count ?? 0
      if (avg === null) return 'No emails on file'
      const parts = []
      if (open > 0) parts.push(`${open} open`)
      if (avg >= 999) parts.push('no replies sent')
      else { const h = avg < 24 ? `${Math.round(avg)}h` : `${Math.round(avg/24)}d`; parts.push(`${h} avg reply`) }
      return parts.length ? parts.join(' · ') : 'All caught up'
    }
    function whyDetailText(r) {
      const avg  = r.avg_response_hours
      const open = r.open_thread_count ?? 0
      if (avg === null) return 'No emails from this resident in the last 90 days.'
      const replyStr = avg >= 999
        ? 'No replies sent to their emails.'
        : `Average reply time: ${avg < 24 ? Math.round(avg) + 'h' : Math.round(avg/24) + ' days'}.`
      const openStr  = open === 0 ? 'No open threads.' : `${open} email thread${open > 1 ? 's' : ''} still open.`
      return `${replyStr} ${openStr}`
    }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1) }
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }
    let _toastTimer = null
    function showToast(msg) {
      const el = document.getElementById('toast')
      el.textContent = msg; el.classList.add('show')
      clearTimeout(_toastTimer)
      _toastTimer = setTimeout(() => el.classList.remove('show'), 3200)
    }
  </script>
</body>
</html>
