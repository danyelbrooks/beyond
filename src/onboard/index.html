<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Onboarding — Beyond Property Management</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bpm-blue:    #1a56db;
      --bpm-green:   #16a34a;
      --bpm-border:  #e2e8f0;
      --bpm-bg:      #f8fafc;
      --bpm-surface: #ffffff;
      --bpm-text:    #1e293b;
      --bpm-muted:   #64748b;
      --bpm-radius:  8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bpm-bg);
      color: var(--bpm-text);
      min-height: 100vh;
    }

    /* Header */
    .portal-header {
      background: var(--bpm-surface);
      border-bottom: 1px solid var(--bpm-border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .portal-logo {
      font-size: 1rem;
      font-weight: 800;
      color: var(--bpm-blue);
      letter-spacing: -0.3px;
    }
    .portal-logo span { color: var(--bpm-text); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }

    /* Progress bar */
    .progress-section {
      background: var(--bpm-surface);
      border-bottom: 1px solid var(--bpm-border);
      padding: 16px 24px;
    }
    .progress-steps {
      display: flex;
      gap: 0;
      max-width: 680px;
      margin: 0 auto;
    }
    .step-dot {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
      gap: 6px;
    }
    .step-dot::before {
      content: '';
      position: absolute;
      top: 14px;
      left: calc(-50% + 14px);
      right: calc(50% + 14px);
      height: 2px;
      background: var(--bpm-border);
    }
    .step-dot:first-child::before { display: none; }
    .step-dot.done::before, .step-dot.active::before { background: var(--bpm-blue); }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--bpm-border);
      background: var(--bpm-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--bpm-muted);
      z-index: 1;
      position: relative;
    }
    .step-dot.done .step-circle  { background: var(--bpm-blue); border-color: var(--bpm-blue); color: #fff; }
    .step-dot.active .step-circle { border-color: var(--bpm-blue); color: var(--bpm-blue); font-weight: 800; }
    .step-dot.skipped .step-circle { background: #e5e7eb; }

    .step-name {
      font-size: 0.62rem;
      color: var(--bpm-muted);
      text-align: center;
      max-width: 60px;
      line-height: 1.2;
      display: none;
    }
    @media (min-width: 540px) { .step-name { display: block; } }
    .step-dot.active .step-name { color: var(--bpm-blue); font-weight: 600; }

    /* Main content */
    .portal-body {
      max-width: 680px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .step-card {
      background: var(--bpm-surface);
      border: 1px solid var(--bpm-border);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .step-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--bpm-blue);
      margin-bottom: 6px;
    }
    .step-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .step-subtitle {
      font-size: 0.9rem;
      color: var(--bpm-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Form elements */
    .field-group { margin-bottom: 18px; }
    .field-row { display: flex; gap: 14px; margin-bottom: 18px; }
    .field-row .field-group { flex: 1; margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--bpm-text);
    }
    label.required::after { content: ' *'; color: #dc2626; }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--bpm-border);
      border-radius: 6px;
      font-size: 0.875rem;
      color: var(--bpm-text);
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--bpm-blue);
      box-shadow: 0 0 0 3px rgba(26,86,219,.12);
    }
    input[readonly] { background: #f1f5f9; color: var(--bpm-muted); }
    textarea { resize: vertical; min-height: 80px; }

    .radio-stack { display: flex; flex-direction: column; gap: 10px; }
    .radio-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--bpm-border);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .radio-option:hover { border-color: var(--bpm-blue); background: #f0f4ff; }
    .radio-option input[type="radio"] { margin-top: 2px; flex-shrink: 0; }
    .radio-option.selected { border-color: var(--bpm-blue); background: #eff6ff; }
    .radio-option-label { font-size: 0.875rem; font-weight: 600; }
    .radio-option-desc  { font-size: 0.78rem; color: var(--bpm-muted); margin-top: 2px; }

    /* Consent box */
    .consent-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .consent-box h4 { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--bpm-blue); margin-bottom: 8px; }
    .consent-box p  { font-size: 0.82rem; line-height: 1.5; color: #1e40af; margin-bottom: 10px; }
    .consent-check  { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; cursor: pointer; }
    .consent-check input { width: auto; }

    /* Signature area */
    .sig-tabs { display: flex; gap: 0; border: 1px solid var(--bpm-border); border-radius: 6px; overflow: hidden; margin-bottom: 12px; width: fit-content; }
    .sig-tab {
      padding: 7px 18px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      background: #f8fafc;
      color: var(--bpm-muted);
      border: none;
      transition: background 0.12s;
    }
    .sig-tab.active { background: var(--bpm-blue); color: #fff; }

    .sig-canvas-wrap {
      border: 1px solid var(--bpm-border);
      border-radius: 6px;
      background: #fff;
      position: relative;
      margin-bottom: 8px;
    }
    canvas#sig-canvas {
      display: block;
      width: 100%;
      max-width: 560px;
      height: 150px;
      cursor: crosshair;
      touch-action: none;
    }

    .sig-type-wrap { display: none; }
    .sig-type-wrap.active { display: block; }
    .sig-canvas-wrap.hidden { display: none; }

    input#sig-typed {
      font-family: 'Georgia', cursive;
      font-style: italic;
      font-size: 1.5rem;
      padding: 20px;
      height: 80px;
      margin-bottom: 8px;
    }

    .sig-clear { font-size: 0.78rem; color: var(--bpm-muted); cursor: pointer; text-decoration: underline; }
    .sig-clear:hover { color: var(--bpm-text); }

    .sig-declaration {
      font-size: 0.8rem;
      color: var(--bpm-muted);
      padding: 10px;
      background: #f8fafc;
      border-radius: 6px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* File upload */
    .file-drop {
      border: 2px dashed var(--bpm-border);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .file-drop:hover, .file-drop.drag-over { border-color: var(--bpm-blue); background: #eff6ff; }
    .file-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-drop-icon { font-size: 2rem; margin-bottom: 8px; }
    .file-drop-label { font-weight: 600; font-size: 0.9rem; color: var(--bpm-text); }
    .file-drop-hint  { font-size: 0.78rem; color: var(--bpm-muted); margin-top: 4px; }
    .file-selected { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f0fdf4; border: 1px solid #86efac; border-radius: 6px; margin-top: 10px; }
    .file-selected-name { font-size: 0.875rem; font-weight: 600; color: #14532d; }
    .file-remove { font-size: 0.78rem; color: #dc2626; cursor: pointer; margin-left: auto; }

    /* Info box */
    .info-box {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.85rem;
      color: #92400e;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .info-box.blue { background: #eff6ff; border-color: #93c5fd; color: #1e40af; }

    /* Deposit */
    .deposit-amount {
      font-size: 3rem;
      font-weight: 900;
      color: var(--bpm-blue);
      text-align: center;
      padding: 20px;
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      background: var(--bpm-blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-back {
      background: none;
      border: 1px solid var(--bpm-border);
      color: var(--bpm-muted);
      padding: 10px 20px;
      border-radius: var(--bpm-radius);
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-back:hover { border-color: var(--bpm-blue); color: var(--bpm-blue); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      background: var(--bpm-surface);
      color: var(--bpm-text);
      border: 1px solid var(--bpm-border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-secondary:hover { background: #f1f5f9; }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--bpm-border);
    }

    /* Conditional sections */
    .conditional { display: none; }
    .conditional.visible { display: block; }

    /* Section divider */
    .form-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--bpm-muted);
      padding: 18px 0 8px;
      border-bottom: 1px solid var(--bpm-border);
      margin-bottom: 16px;
    }
    .form-section-title:first-child { padding-top: 0; }

    /* Error/loading states */
    .error-screen, .loading-screen {
      text-align: center;
      padding: 80px 24px;
    }
    .error-screen h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .error-screen p  { color: var(--bpm-muted); }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--bpm-blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.875rem;
      color: #991b1b;
      margin-top: 12px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* Completion screen */
    .complete-screen { text-align: center; }
    .complete-screen .checkmark {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    .complete-screen h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; }
    .complete-screen p  { color: var(--bpm-muted); font-size: 0.95rem; line-height: 1.6; max-width: 480px; margin: 0 auto 20px; }

    .roadmap {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      padding: 20px;
      text-align: left;
      max-width: 480px;
      margin: 20px auto;
    }
    .roadmap h4 { font-size: 0.85rem; font-weight: 700; color: #14532d; margin-bottom: 10px; }
    .roadmap li { font-size: 0.85rem; color: #166534; padding: 4px 0; list-style: none; }
    .roadmap li::before { content: '✓ '; font-weight: 700; }

    .contact-footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--bpm-muted);
    }
    .contact-footer a { color: var(--bpm-blue); }

    /* Confetti */
    @keyframes confetti-fall {
      0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      width: 8px;
      height: 12px;
      top: -20px;
      animation: confetti-fall linear forwards;
      z-index: 999;
      pointer-events: none;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="portal-header">
  <div class="portal-logo">Beyond Property Management <span>| Owner Onboarding</span></div>
</div>

<!-- Progress bar -->
<div class="progress-section">
  <div class="progress-steps" id="progress-steps"></div>
</div>

<!-- Main content -->
<div class="portal-body">
  <div id="portal-content">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p style="color:var(--bpm-muted)">Loading your onboarding...</p>
    </div>
  </div>
</div>

<script>
// =============================================================================
// STATE
// =============================================================================

let state = null
const API  = ''  // same origin — onboarding server serves this file

function getToken() {
  const segments = window.location.pathname.split('/')
  return segments[segments.length - 1] || segments[segments.length - 2] || ''
}

function escHtml(s) {
  if (!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function formatTin(input, prefix) {
  const tinType = document.querySelector(`input[name="${prefix}tin-type"]:checked`)?.value
  const digits  = input.value.replace(/\D/g, '')
  if (tinType === 'ein') {
    // EIN: XX-XXXXXXX (max 10 chars)
    input.value     = digits.length > 2 ? digits.slice(0,2) + '-' + digits.slice(2,9) : digits
    input.maxLength = 10
  } else {
    // SSN: XXX-XX-XXXX (max 11 chars)
    let v = digits.slice(0, 9)
    if (v.length > 5) v = v.slice(0,3) + '-' + v.slice(3,5) + '-' + v.slice(5)
    else if (v.length > 3) v = v.slice(0,3) + '-' + v.slice(3)
    input.value     = v
    input.maxLength = 11
  }
}

function goBack(currentStepNumber) {
  const renders = { 1: renderStep1, 2: renderStep2, 3: renderStep3, 4: renderStep4, 5: renderStep5, 6: renderStep6, 7: renderStep7 }
  for (let n = currentStepNumber - 1; n >= 1; n--) {
    const step = (state.steps || []).find(s => s.stepNumber === n)
    if (!step || step.status !== 'skipped') {
      const fn = renders[n]
      if (fn) { fn(); window.scrollTo({ top: 0, behavior: 'smooth' }); return }
    }
  }
}

function updateTinFormat(prefix) {
  const tinType = document.querySelector(`input[name="${prefix}tin-type"]:checked`)?.value
  const el      = document.getElementById(`${prefix}tin`)
  if (!el) return
  el.placeholder = tinType === 'ein' ? 'XX-XXXXXXX' : 'XXX-XX-XXXX'
  el.maxLength   = tinType === 'ein' ? 10 : 11
  if (el.value) { el.value = el.value.replace(/\D/g, ''); formatTin(el, prefix) }
}

function formatDate(dateStr) {
  if (!dateStr) return ''
  // dateStr is YYYY-MM-DD from Postgres; parse as local date to avoid UTC shift
  const [y, m, d] = dateStr.split('-').map(Number)
  const dt = new Date(y, m - 1, d)
  return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
}

// =============================================================================
// INIT
// =============================================================================

async function init() {
  const token = getToken()
  if (!token || token.length !== 64) {
    showErrorScreen('invalid')
    return
  }

  try {
    const res = await fetch(`${API}/api/onboard/${token}`)
    if (res.status === 404) { showErrorScreen('invalid')  ; return }
    if (res.status === 403) { showErrorScreen('revoked')  ; return }
    if (!res.ok)             { showErrorScreen('generic') ; return }
    state = await res.json()
    renderProgress()
    renderCurrentStep()
  } catch (err) {
    showErrorScreen('generic')
  }
}

function showErrorScreen(type) {
  const msgs = {
    invalid: { h: 'Link Not Found', p: 'This onboarding link is invalid or has expired. Please contact help@bpmsd.com.' },
    revoked: { h: 'Link Revoked', p: 'This onboarding has been revoked. Please contact Beyond Property Management at help@bpmsd.com.' },
    generic: { h: 'Something Went Wrong', p: 'Unable to load your onboarding. Please try again or contact help@bpmsd.com.' },
  }
  const m = msgs[type] || msgs.generic
  document.getElementById('portal-content').innerHTML = `
    <div class="error-screen">
      <h2>${m.h}</h2>
      <p>${m.p}</p>
    </div>
  `
}

// =============================================================================
// PROGRESS BAR
// =============================================================================

const STEP_LABELS = ['Agreement', 'Questionnaire', 'Tax Forms', 'Entity Docs', 'Insurance', 'Deposit', 'Addendum']

function renderProgress() {
  if (!state?.steps) return
  const container = document.getElementById('progress-steps')
  container.innerHTML = state.steps.map((s, i) => {
    const num    = s.stepNumber
    const status = s.status
    let cls = 'step-dot'
    if (status === 'complete' || status === 'skipped') cls += ' done'
    else if (num === state.currentStep) cls += ' active'
    else cls += ' future'
    if (status === 'skipped') cls += ' skipped'
    const circle = status === 'complete' ? '&#10003;' : (status === 'skipped' ? '—' : String(num))
    return `
      <div class="${cls}">
        <div class="step-circle">${circle}</div>
        <div class="step-name">${escHtml(STEP_LABELS[i] || `Step ${num}`)}</div>
      </div>
    `
  }).join('')
}

// =============================================================================
// ROUTING
// =============================================================================

function renderCurrentStep() {
  const step = (state.steps || []).find(s => s.status === 'not_started' || s.status === 'in_progress')
  if (!step) { renderComplete() ; return }

  const renders = { 1: renderStep1, 2: renderStep2, 3: renderStep3, 4: renderStep4, 5: renderStep5, 6: renderStep6, 7: renderStep7 }
  const fn = renders[step.stepNumber]
  if (fn) fn()
  else renderComplete()
}

async function submitStep(stepNumber, payload, isFormData = false) {
  const token   = getToken()
  const url     = `${API}/api/onboard/${token}/step/${stepNumber}`
  const options = isFormData
    ? { method: 'POST', body: payload }
    : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }

  const res    = await fetch(url, options)
  const result = await res.json()
  if (!res.ok) throw new Error(result.error || `Step ${stepNumber} submission failed`)
  return result
}

async function advanceAfterStep(result) {
  if (result.complete) { renderComplete() ; return }
  // Refresh state from server
  const token = getToken()
  const res   = await fetch(`${API}/api/onboard/${token}`)
  if (res.ok) {
    state = await res.json()
    renderProgress()
    renderCurrentStep()
    window.scrollTo({ top: 0, behavior: 'smooth' })
  }
}

// =============================================================================
// SIGNATURE CANVAS HELPER
// =============================================================================

function buildSignatureWidget(containerId) {
  const container = document.getElementById(containerId)
  if (!container) return

  container.innerHTML = `
    <div class="sig-tabs">
      <button class="sig-tab active" data-tab="draw">Draw</button>
      <button class="sig-tab" data-tab="type">Type</button>
    </div>
    <div class="sig-canvas-wrap" id="${containerId}-canvas-wrap">
      <canvas id="${containerId}-canvas" width="560" height="150"></canvas>
      <div style="padding:4px 8px;font-size:0.75rem;color:var(--bpm-muted)">
        Draw your signature above
      </div>
    </div>
    <div class="sig-type-wrap" id="${containerId}-type-wrap">
      <input type="text" id="${containerId}-typed" placeholder="Type your full name" style="font-family:Georgia,serif;font-style:italic;font-size:1.3rem;height:70px;" />
    </div>
    <div><span class="sig-clear" id="${containerId}-clear">Clear</span></div>
  `

  // Canvas drawing
  const canvas  = document.getElementById(`${containerId}-canvas`)
  const ctx     = canvas.getContext('2d')
  let drawing   = false
  ctx.strokeStyle = '#1e293b'
  ctx.lineWidth   = 2
  ctx.lineCap     = 'round'

  function pos(e) {
    const r = canvas.getBoundingClientRect()
    const scaleX = canvas.width  / r.width
    const scaleY = canvas.height / r.height
    const src = e.touches ? e.touches[0] : e
    return { x: (src.clientX - r.left) * scaleX, y: (src.clientY - r.top) * scaleY }
  }

  canvas.addEventListener('mousedown',  e => { drawing = true ; ctx.beginPath() ; const p = pos(e) ; ctx.moveTo(p.x, p.y) })
  canvas.addEventListener('mousemove',  e => { if (!drawing) return ; const p = pos(e) ; ctx.lineTo(p.x, p.y) ; ctx.stroke() })
  canvas.addEventListener('mouseup',    () => { drawing = false })
  canvas.addEventListener('mouseleave', () => { drawing = false })
  canvas.addEventListener('touchstart', e => { e.preventDefault() ; drawing = true ; ctx.beginPath() ; const p = pos(e) ; ctx.moveTo(p.x, p.y) }, { passive: false })
  canvas.addEventListener('touchmove',  e => { e.preventDefault() ; if (!drawing) return ; const p = pos(e) ; ctx.lineTo(p.x, p.y) ; ctx.stroke() }, { passive: false })
  canvas.addEventListener('touchend',   () => { drawing = false })

  // Tab switching
  container.querySelectorAll('.sig-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.sig-tab').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      const tab = btn.dataset.tab
      document.getElementById(`${containerId}-canvas-wrap`).classList.toggle('hidden', tab !== 'draw')
      document.getElementById(`${containerId}-type-wrap`).classList.toggle('active', tab === 'type')
    })
  })

  // Clear
  document.getElementById(`${containerId}-clear`).addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    const typed = document.getElementById(`${containerId}-typed`)
    if (typed) typed.value = ''
  })
}

function getSignatureData(containerId) {
  const activeTab = document.querySelector(`#${containerId} .sig-tab.active`)?.dataset.tab || 'draw'
  if (activeTab === 'type') {
    const text = document.getElementById(`${containerId}-typed`)?.value?.trim()
    if (!text) return null
    // Render typed signature to canvas
    const canvas = document.createElement('canvas')
    canvas.width = 560 ; canvas.height = 150
    const ctx = canvas.getContext('2d')
    ctx.fillStyle = '#fff'
    ctx.fillRect(0, 0, 560, 150)
    ctx.font = 'italic 48px Georgia, serif'
    ctx.fillStyle = '#1e293b'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillText(text, 280, 75)
    return canvas.toDataURL('image/png').split(',')[1]
  } else {
    const canvas = document.getElementById(`${containerId}-canvas`)
    // Check if canvas is blank
    const data = canvas.toDataURL('image/png')
    const blank = document.createElement('canvas')
    blank.width = canvas.width ; blank.height = canvas.height
    if (data === blank.toDataURL('image/png')) return null
    return data.split(',')[1]
  }
}

async function hashDocument(content) {
  const enc  = new TextEncoder()
  const buf  = await crypto.subtle.digest('SHA-256', enc.encode(content))
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('')
}

function showStepError(msg) {
  const el = document.querySelector('.error-msg')
  if (el) { el.textContent = msg ; el.classList.add('visible') }
}

async function submitStep1() {
  const btn = document.getElementById('btn-sign-1')
  const sig = getSignatureData('sig-widget-1')
  if (!sig) return showStepError('Please draw or type your signature before continuing.')

  btn.disabled = true
  btn.textContent = 'Saving...'

  try {
    const docContent = state.agreementType + ':' + state.propertyAddress + ':' + state.ownerName
    const docHash    = await hashDocument(docContent)

    const result = await submitStep(1, {
      signature:    sig,
      consentGiven: true,
      timestamp:    new Date().toISOString(),
      userAgent:    navigator.userAgent,
      documentHash: docHash,
    })
    await advanceAfterStep(result)
  } catch (err) {
    showStepError(err.message)
    btn.disabled = false
    btn.textContent = 'Sign & Continue'
  }
}

  const postBody = {

    _owner3AccountNumber: owner3AccountNumber,  // FOR PDF GENERATION ONLY — do not store
    _owner4RoutingNumber: owner4RoutingNumber,  // FOR PDF GENERATION ONLY — do not store
    _owner4AccountNumber: owner4AccountNumber,  // FOR PDF GENERATION ONLY — do not store

  owner3RoutingNumber = ''; owner3AccountNumber = ''
  owner4RoutingNumber = ''; owner4AccountNumber = ''

  try {
    const result = await submitStep(2, postBody)

    // Upload tenant documents separately — these are NOT part of the main JSON POST
    const docFields = [
      { id: 'doc-lease',              type: 'current_lease' },
      { id: 'doc-application',        type: 'tenant_application' },
      { id: 'doc-move-in-inspection', type: 'move_in_inspection' },
      { id: 'doc-lease-addenda',      type: 'lease_addenda' },
      { id: 'doc-driver-license',     type: 'driver_license' },
      { id: 'doc-other-forms',        type: 'other_documents' },
    ]
    const uploadToken = getToken()
    for (const { id, type } of docFields) {
      const input = document.getElementById(id)
      if (!input || !input.files || input.files.length === 0) continue
      for (const file of Array.from(input.files)) {
        try {
          const fd = new FormData()
          fd.append('file', file)
          fd.append('documentType', type)
          const r = await fetch(`${API}/api/onboard/${uploadToken}/upload-document`, { method: 'POST', body: fd })
          if (!r.ok) console.warn(`[Doc upload] ${type} failed:`, r.status)
        } catch (e) {
          console.warn(`[Doc upload] ${type} error:`, e.message)
          // Non-fatal — warn but do not block step completion
          showStepError('Warning: One or more tenant documents failed to upload. Please contact help@bpmsd.com.')
        }
      }
    }

    await advanceAfterStep(result)
  } catch (err) {
    showStepError(err.message)
    btn.disabled    = false
    btn.textContent = 'Save & Continue'
  }
}

function renderStep3() {
  // Determine ownership structure from step 2 data
  const s2          = state.step2Owners || {}
  const numOwners   = s2.numOwners || '1'
  const owner1Last  = (s2.owner1Last || '').trim().toLowerCase()
  const owner2Last  = (s2.owner2Last || '').trim().toLowerCase()
  const sameLastName = numOwners === '2' && owner1Last && owner2Last && owner1Last === owner2Last
  const twoSets      = numOwners === '2' && !sameLastName
  const combinedName = sameLastName
    ? `${s2.owner1First} & ${s2.owner2First} ${s2.owner1Last}`
    : ''

  // Pre-fill legal name: individual/LLC-single-member → person's name; everything else → entity name
  function nameForOwner(first, last) {
    const isIndividual = state.entityType === 'individual' || !state.entityType
    if (isIndividual) {
      return (first && last) ? `${first} ${last}` : (state.ownerName || '')
    }
    return state.ownerName || ''
  }

  const nameA = sameLastName ? combinedName : nameForOwner(s2.owner1First, s2.owner1Last)
  const nameB = twoSets      ? nameForOwner(s2.owner2First, s2.owner2Last) : ''

  // Pre-select classification based on entity type
  let preselect = ''
  if      (state.entityType === 'individual') preselect = 'individual_sole_prop'
  else if (state.entityType === 'trust')      preselect = 'trust_estate'
  else if (state.entityType === 'partnership') preselect = 'partnership'
  // 'corp' and 'llc' wait for sub-type radio selection below

  // Sub-type selection section for LLC / Corp
  function entitySubtypeSection() {
    if (state.entityType === 'llc') {
      return `

            <label class="radio-option"><input type="radio" name="llc-subtype" value="llc_multi_member" />

    }
    return ''
  }

  // Build classification <option> list with optional pre-selection
  function classificationOptions(selectedVal) {
    const opts = [

      ['s_corp',            'S Corporation'],
      ['partnership',       'Partnership'],
      ['trust_estate',      'Trust / Estate'],

      ['llc_p',             'LLC taxed as Partnership'],

  // CA notice toggle — one per W-9 block
  function setupCaToggle(prefix, caName) {
    document.querySelectorAll(`input[name="${caName}"]`).forEach(radio => {
      radio.addEventListener('change', () => {
        document.getElementById(`${prefix}ca-no-notice`).style.display =
          radio.value === 'no' ? 'block' : 'none'
        document.querySelectorAll(`input[name="${caName}"]`).forEach(r =>
          r.closest('.radio-option')?.classList.remove('selected')
        )
        radio.closest('.radio-option')?.classList.add('selected')
      })
    })
  }

  setupCaToggle('w9a_', 'ca-resident-a')
  if (twoSets) setupCaToggle('w9b_', 'ca-resident-b')

  // Sub-type → tax-class sync for LLC and Corp
  function syncSubtype(radioName) {
    document.querySelectorAll(`input[name="${radioName}"]`).forEach(r => {
      r.addEventListener('change', () => {
        document.querySelectorAll(`input[name="${radioName}"]`).forEach(x =>
          x.closest('.radio-option')?.classList.remove('selected'))
        r.closest('.radio-option')?.classList.add('selected')
        ;['w9a_', 'w9b_'].forEach(pfx => {
          const sel = document.getElementById(`${pfx}tax-class`)
          if (sel) { sel.value = r.value; sel.dispatchEvent(new Event('change')) }
        })
      })
    })
  }
  if (state.entityType === 'llc')  syncSubtype('llc-subtype')
  if (state.entityType === 'corp') syncSubtype('corp-subtype')

  // Classification hints and TIN type auto-selection
  const CLASS_HINTS = {
    individual_sole_prop: "Legal name: person's name only. TIN: SSN preferred.",
    c_corp:               'Legal name: business name only. TIN: EIN required.',
    s_corp:               'Legal name: business name only. TIN: EIN required.',
    partnership:          'Legal name: partnership name. TIN: EIN required (if SSN — call BPM).',
    trust_estate:         'Legal name: trust name. TIN: EIN required (if SSN — call BPM).',
    llc_c:                'Legal name: business name only. TIN: EIN required.',
    llc_s:                'Legal name: business name only. TIN: EIN required.',
    llc_p:                'Legal name: LLC name. TIN: EIN required.',
    llc_single_member:    "Legal name: person's name only. TIN: SSN or EIN.",
    llc_multi_member:     'Legal name: LLC name. TIN: EIN required.',
  }
  const EIN_ONLY = new Set(['c_corp', 's_corp', 'partnership', 'trust_estate', 'llc_c', 'llc_s', 'llc_p', 'llc_multi_member'])

  function setupClassificationHandler(prefix) {
    const sel = document.getElementById(`${prefix}tax-class`)
    if (!sel) return

    function applyClassification(val) {
      const hint = document.getElementById(`${prefix}class-hint`)
      if (hint) hint.textContent = CLASS_HINTS[val] || ''
      if (EIN_ONLY.has(val)) {
        const einRadio = document.getElementById(`${prefix}tin-ein`)
        if (einRadio) { einRadio.checked = true }
        const tinInput = document.getElementById(`${prefix}tin`)
        if (tinInput) tinInput.placeholder = 'XX-XXXXXXX'
      }
    }

    sel.addEventListener('change', () => applyClassification(sel.value))

    // TIN type changes update placeholder
    document.querySelectorAll(`input[name="${prefix}tin-type"]`).forEach(r => {
      r.addEventListener('change', () => {
        const tinInput = document.getElementById(`${prefix}tin`)
        if (tinInput) tinInput.placeholder = r.value === 'ssn' ? 'XXX-XX-XXXX' : 'XX-XXXXXXX'
      })
    })

    // Apply initial state for pre-selected classification
    if (preselect) applyClassification(preselect)
  }

  setupClassificationHandler('w9a_')
  if (twoSets) setupClassificationHandler('w9b_')

  document.getElementById('btn-submit-tax').addEventListener('click', submitStep3)
  document.getElementById('btn-skip-3').addEventListener('click', () => skipStep(3))
}

async function submitStep3() {
  const btn = document.getElementById('btn-submit-tax')

  // Recalculate ownership structure (same logic as renderStep3)
  const s2          = state.step2Owners || {}
  const numOwners   = s2.numOwners || '1'
  const owner1Last  = (s2.owner1Last || '').trim().toLowerCase()
  const owner2Last  = (s2.owner2Last || '').trim().toLowerCase()
  const sameLastName = numOwners === '2' && owner1Last && owner2Last && owner1Last === owner2Last
  const twoSets      = numOwners === '2' && !sameLastName

  // Collect all fields for one W-9 block
  function collectW9(prefix, caName) {
    return {
      legalName:         (document.getElementById(`${prefix}legal-name`)?.value || '').trim(),
      businessName:      (document.getElementById(`${prefix}biz-name`)?.value   || '').trim(),
      taxClassification:  document.getElementById(`${prefix}tax-class`)?.value   || '',
      tinType:            document.querySelector(`input[name="${prefix}tin-type"]:checked`)?.value || '',
      exemptPayeeCode:   (document.getElementById(`${prefix}exempt`)?.value     || '').trim(),
      address:           (document.getElementById(`${prefix}address`)?.value    || '').trim(),
      city:              (document.getElementById(`${prefix}city`)?.value       || '').trim(),
      state:             (document.getElementById(`${prefix}state`)?.value      || '').trim(),
      zip:               (document.getElementById(`${prefix}zip`)?.value        || '').trim(),
      caResident:         document.querySelector(`input[name="${caName}"]:checked`)?.value === 'yes',
      _caAnswered:       !!document.querySelector(`input[name="${caName}"]:checked`),
    }
  }

  const w9a = collectW9('w9a_', 'ca-resident-a')
  const w9b = twoSets ? collectW9('w9b_', 'ca-resident-b') : null

  // TIN values stay in local vars — never written to state
  let tinA = (document.getElementById('w9a_tin')?.value || '').trim()
  let tinB = twoSets ? (document.getElementById('w9b_tin')?.value || '').trim() : ''

  // Validate owner 1
  if (!w9a.legalName)          return showStepError('Legal name is required.')
  if (!w9a.taxClassification)  return showStepError('Tax classification is required.')
  if (!w9a.tinType)            return showStepError('Please select SSN or EIN.')
  if (!tinA)                   return showStepError('SSN/TIN is required.')
  if (!w9a.address || !w9a.city || !w9a.state || !w9a.zip)
                               return showStepError('Full address is required.')
  if (!w9a._caAnswered)        return showStepError('Please answer the California residency question.')

  // Validate owner 2 if separate W-9
  if (twoSets && w9b) {
    if (!w9b.legalName)         return showStepError('Legal name is required for Owner 2.')
    if (!w9b.taxClassification) return showStepError('Tax classification is required for Owner 2.')
    if (!w9b.tinType)           return showStepError('Please select SSN or EIN for Owner 2.')
    if (!tinB)                  return showStepError('SSN/TIN is required for Owner 2.')
    if (!w9b.address || !w9b.city || !w9b.state || !w9b.zip)
                                return showStepError('Full address is required for Owner 2.')
    if (!w9b._caAnswered)       return showStepError('Please answer the California residency question for Owner 2.')
  }

  const sig = getSignatureData('sig-widget-3')
  if (!sig) return showStepError('Please sign the tax forms before continuing.')

  // Danyel flags — do not block the form, just flag for review
  const NEEDS_EIN = new Set(['partnership', 'trust_estate'])
  w9a.tinMismatch = NEEDS_EIN.has(w9a.taxClassification) && w9a.tinType === 'ssn'
  if (w9b) w9b.tinMismatch = NEEDS_EIN.has(w9b.taxClassification) && w9b.tinType === 'ssn'

  // Remove internal-only fields before sending
  delete w9a._caAnswered
  if (w9b) delete w9b._caAnswered

  btn.disabled = true
  btn.textContent = 'Processing...'

  try {
    const owners = twoSets && w9b ? [w9a, w9b] : [w9a]

    const result = await submitStep(3, {
      numW9s:      twoSets ? 2 : 1,
      sameLastName,
      owners,
      _tin_a:      tinA,    // prefixed _ = PDF only, server must not write to Supabase
      _tin_b:      tinB,
      w9Signature: sig,
      timestamp:   new Date().toISOString(),
      userAgent:   navigator.userAgent,
    })

    // Zero out TIN references immediately after sending
    tinA = ''
    tinB = ''

    await advanceAfterStep(result)
  } catch (err) {
    tinA = ''
    tinB = ''
    showStepError(err.message)
    btn.disabled = false
    btn.textContent = 'Submit Tax Forms & Continue'
  }
}

function renderInsResult(scanResult, serverResult) {
  const el = document.getElementById('ins-result-view')

  if (scanResult === 'ADDITIONALLY_INSURED') {
    el.innerHTML = `
      <div class="info-box" style="background:#f0fdf4;border-color:#86efac;color:#166534">
        <strong>You&rsquo;re all set!</strong><br>
        Your policy shows Beyond Property Management listed as an Additionally Insured party. No action needed.
      </div>
      <div class="btn-row" style="justify-content:flex-end;margin-top:24px">
        <button class="btn-primary" id="btn-ins-continue">Continue &#8594;</button>
      </div>
    `
    document.getElementById('btn-ins-continue').addEventListener('click', () => advanceAfterStep(serverResult))

  } else if (scanResult === 'CERTIFICATE_HOLDER') {
    el.innerHTML = `
      <div class="info-box" style="background:#fffbeb;border-color:#fcd34d;color:#92400e;margin-bottom:20px">
        <strong>BPM is listed as Certificate Holder only.</strong><br>
        To fully protect both you and BPM, we need to be listed as Additionally Insured. You have two options:
      </div>

        <div style="display:flex;flex-direction:column;gap:12px">
          <button class="btn-primary" id="btn-surevestor-yes">Yes &mdash; enroll me in Surevestor protection ($25/mo)</button>

        </div>
      </div>
      <div id="ins-cert-deadline" style="display:none;margin-top:20px">
        <div class="info-box" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b">

        </div>
        <div class="btn-row" style="justify-content:flex-end;margin-top:16px">
          <button class="btn-primary" id="btn-ins-continue-ch">Continue &#8594;</button>
        </div>
      </div>
    `
    document.getElementById('btn-surevestor-yes').addEventListener('click', async () => {
      const btn = document.getElementById('btn-surevestor-yes')
      btn.disabled = true ; btn.textContent = 'Enrolling…'
      try {
        const res = await fetch(`${API}/api/onboard/${getToken()}/step/5/surevestor`, {
          method:  'POST',

          body:    JSON.stringify({ approved: true }),

        if (!res.ok) throw new Error('Request failed')

      } catch {
        btn.disabled = false
        btn.textContent = 'Yes — enroll me in Surevestor protection ($25/mo)'
        document.getElementById('ins-result-view').insertAdjacentHTML('beforeend',
          '<p style="color:#dc2626;font-size:0.85rem;margin-top:8px">Something went wrong. Please try again.</p>')
      }
    })
    document.getElementById('btn-surevestor-no').addEventListener('click', () => {
      document.getElementById('ins-cert-options').style.display  = 'none'
      document.getElementById('ins-cert-deadline').style.display = 'block'

  } else if (scanResult === 'NOT_FOUND') {

async function submitStep7() {
  const btn = document.getElementById('btn-sign-7')
  const sig = getSignatureData('sig-widget-7')
  if (!sig) return showStepError('Please draw or type your signature before completing.')

  btn.disabled = true
  btn.textContent = 'Completing...'

  try {
    const docHash = await hashDocument('Occupied Units Addendum:' + state.propertyAddress + ':' + state.ownerName)
    const result  = await submitStep(7, {
      signature:    sig,
      consentGiven: true,
      timestamp:    new Date().toISOString(),
      userAgent:    navigator.userAgent,
      documentHash: docHash,
    })
    if (result.complete || result.success) {
      renderComplete()
    }
  } catch (err) {
    showStepError(err.message)
    btn.disabled = false
    btn.textContent = 'Sign & Complete Onboarding'
  }
}

async function skipStep(n) {
  const btn = document.getElementById(`btn-skip-${n}`)
  if (btn) { btn.disabled = true; btn.textContent = 'Skipping...' }
  try {
    const res  = await fetch(`${API}/api/onboard/${getToken()}/step/${n}/skip`, { method: 'POST' })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || 'Failed to skip')
    const stateRes = await fetch(`${API}/api/onboard/${getToken()}`)
    if (stateRes.ok) state = await stateRes.json()
    renderProgress()
    renderCurrentStep()
  } catch (err) {
    showStepError(err.message)
    if (btn) { btn.disabled = false; btn.textContent = 'Skip for now' }
  }
}

async function skipStep7() {
  const btn = document.getElementById('btn-skip-7')
  btn.disabled = true
  btn.textContent = 'Skipping...'
  try {
    const res = await fetch(`${API}/api/onboard/${getToken()}/step/7/skip`, { method: 'POST' })

// =============================================================================
// FILE UPLOAD HELPER
// =============================================================================

function setupFileUpload(inputId, dropId, selectedId, nameId, removeId, btnId, onSelected) {
  const input    = document.getElementById(inputId)
  const dropZone = document.getElementById(dropId)
  const selectedDiv = document.getElementById(selectedId)
  const nameSpan = document.getElementById(nameId)
  const btn      = document.getElementById(btnId)

  function selectFile(file) {
    if (!file) return
    nameSpan.textContent = file.name
    selectedDiv.style.display = 'flex'
    btn.disabled = false
    if (onSelected) onSelected(file)
  }

  input.addEventListener('change', () => { if (input.files[0]) selectFile(input.files[0]) })

  dropZone.addEventListener('dragover', e => { e.preventDefault() ; dropZone.classList.add('drag-over') })
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'))
  dropZone.addEventListener('drop', e => {
    e.preventDefault()
    dropZone.classList.remove('drag-over')
    if (e.dataTransfer.files[0]) {
      const dt = new DataTransfer()
      dt.items.add(e.dataTransfer.files[0])
      input.files = dt.files
      selectFile(e.dataTransfer.files[0])
    }
  })

  document.getElementById(removeId).addEventListener('click', () => {
    input.value = ''
    selectedDiv.style.display = 'none'
    btn.disabled = true
  })
}

async function submitFileStep(stepNumber, inputId, extraFields = {}) {
  const input = document.getElementById(inputId)
  const file  = input.files[0]
  if (!file) return showStepError('Please select a file before continuing.')

  const btn = document.querySelector(`#btn-upload-${stepNumber}`)
  if (btn) { btn.disabled = true ; btn.textContent = 'Uploading...' }

  try {
    const formData = new FormData()
    formData.append('document', file)
    Object.entries(extraFields).forEach(([k, v]) => formData.append(k, v))

    const result = await submitStep(stepNumber, formData, true)
    await advanceAfterStep(result)
  } catch (err) {
    showStepError(err.message)
    if (btn) { btn.disabled = false ; btn.textContent = 'Upload & Continue' }
  }
}

  const roadmaps = {
    none: [

      'Our leasing team will send you showing activity updates weekly',
      'You\'ll receive your first owner statement within 30 days',
    ],
    leaving: [
      'We\'ll coordinate the move-out inspection with your tenant',
      'The property will be listed for rent immediately after move-out',
      'You\'ll receive a summary of move-out costs within 5 days',
    ],
    staying: [
      'We\'ll introduce ourselves to your tenant within 48 hours',
      'Rent collection will transition to AppFolio on the next payment cycle',
      'You\'ll receive your first owner statement within 30 days',
    ],
  }

  const roadmapItems = roadmaps[occupancy] || roadmaps.none

  document.getElementById('portal-content').innerHTML = `
    <div class="step-card complete-screen">
      <div class="checkmark">&#127881;</div>
      <h2>You're all set, ${escHtml(name)}!</h2>
      <p>Your onboarding with Beyond Property Management is complete. We're excited to work with you.</p>

      <div class="roadmap">
        <h4>What Happens Next</h4>
        <p>Our Onboarding Specialist will reach out to you in the next 24 business hours. You can also reach out to us directly at <a href="tel:+18582224663">(858) 222-4663</a>.</p>
      </div>

      <p class="contact-footer">
        Questions? Email <a href="mailto:help@bpmsd.com">help@bpmsd.com</a>
      </p>
    </div>
  `

  // Update progress bar to show all complete
  if (state.steps) {
    state.steps.forEach(s => {
      if (s.status !== 'skipped') s.status = 'complete'
    })
    state.currentStep = null
    renderProgress()
  }

  launchConfetti()
}

function launchConfetti() {
  const colors = ['#1a56db', '#16a34a', '#f59e0b', '#ec4899', '#8b5cf6']
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div')
    el.className = 'confetti-piece'
    el.style.cssText = `
      left: ${Math.random() * 100}vw;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-duration: ${1.5 + Math.random() * 2}s;
      animation-delay: ${Math.random() * 0.8}s;
      transform: rotate(${Math.random() * 360}deg);
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
    `
    document.body.appendChild(el)
    el.addEventListener('animationend', () => el.remove())
  }
}
